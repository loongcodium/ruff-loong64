# This file is generated by scripts/update_workflow.py

name: Release
on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

env:
  RUFF_VERSION: 0.16.5
  RUFF_VSCODE_VERSION: 2026.76.0

jobs:
  build-ruff:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform:
        # There's currently no loong64 support for Ubuntu so we are using Debian
          - target: loongarch64-unknown-linux-gnu
            arch: loong64
            base_image: --platform=linux/loong64 ghcr.io/loong64/debian:trixie
            maturin_docker_options: -e JEMALLOC_SYS_WITH_LG_PAGE=16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          repository: astral-sh/ruff
          ref: ${{ env.RUFF_VERSION }}
      - uses: actions/checkout@v5
        with:
          path: ruff-loong64
          sparse-checkout: |
            patches/ruff.patch
          sparse-checkout-cone-mode: false
      - name: Apply patch
        run: |
          git apply ruff-loong64/patches/ruff.patch
          rm -rf ruff-loong64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: ''
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Prep README.md
        run: python scripts/transform_readme.py --target pypi
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          sccache: false
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          docker-options: ${{ matrix.platform.maturin_docker_options }}
          args: --release --locked --out dist
      - uses: uraimo/run-on-arch-action@f9b26e3a1a408d5fd530d20c17b9f3f4428ff8d9 # v3.1.0
        if: ${{ matrix.platform.arch != 'ppc64le'}}
        name: Test wheel
        with:
          arch: ${{ matrix.platform.arch == 'arm' && 'armv6' || matrix.platform.arch }}
          distro: ${{ matrix.platform.arch == 'arm' && 'bullseye' || 'ubuntu20.04' }}
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pip python3-venv libatomic1
          run: |
            python3 -m venv .venv
            source .venv/bin/activate
            pip3 install -U pip
            pip3 install ${{ env.PACKAGE_NAME }} --no-index --find-links dist/ --force-reinstall
            ruff --help
          base_image: ${{ matrix.platform.base_image }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist
      - name: Archive binary
        shell: bash
        run: |
          set -euo pipefail

          TARGET=${{ matrix.platform.target }}
          ARCHIVE_NAME=ruff-$TARGET
          ARCHIVE_FILE=$ARCHIVE_NAME.tar.gz

          mkdir -p $ARCHIVE_NAME
          cp target/$TARGET/release/ruff $ARCHIVE_NAME/ruff
          tar czvf $ARCHIVE_FILE $ARCHIVE_NAME
          shasum -a 256 $ARCHIVE_FILE > $ARCHIVE_FILE.sha256
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-${{ matrix.platform.target }}
          path: |
            *.tar.gz
            *.sha256

    env:
      ACTIONS_CACHE_MODE: none
      PACKAGE_NAME: ruff
      MODULE_NAME: ruff
      PYTHON_VERSION: '3.13'
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUSTUP_MAX_RETRIES: 10

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: loongarch64-unknown-linux-gnu
            code-target: linux-loong64
            python-platform: manylinux_2_36_loongarch64

    name: Build (${{ matrix.target }})
    needs: [build-ruff]
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ env.FETCH_DEPTH }}
          persist-credentials: false
          repository: astral-sh/ruff-vscode
          ref: ${{ env.RUFF_VSCODE_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6

      - name: Download wheels from previous step
        uses: actions/download-artifact@v5
        with:
          name: wheels-${{ matrix.target }}

      - name: Install libraries
        run: |
          uv export --default-index https://pypi.org/simple --format requirements-txt --no-dev --no-emit-project --locked --no-emit-package ruff --output-file ./requirements.txt
          git diff -- requirements.txt
          python3 -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade -r ./requirements.txt --platform=${{ matrix.python-platform }}
          python3 -m pip install -t ./bundled/libs --implementation py --no-deps --upgrade ruff --no-index --find-links . --platform=${{ matrix.python-platform }}

      - name: Patch metadata
        run: |
          cat package.json | \
          jq '.displayName="Ruff (loong64)"' | \
          jq '.description=(.description) + " This version is for LoongArch64 only."' | \
          jq '.version="${{ github.ref_name }}"' | \
          jq '.publisher="loong-vsx"' | \
          jq '.homepage="https://github.com/loongcodium/ruff-loong64"' | \
          jq '.repository.url="https://github.com/loongcodium/ruff-loong64.git"' | \
          jq '.bugs.url="https://github.com/loongcodium/ruff-loong64/issues"' \
          > tmp.json && mv -v tmp.json package.json

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false

      # Install Node dependencies.
      - run: npm ci --ignore-scripts
      - name: Package Extension (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx vsce package -o "./dist/ruff-${{ matrix.code-target }}.vsix"
      - name: Package Extension (nightly)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npx vsce package -o "./dist/ruff-${{ matrix.code-target }}.vsix" --pre-release

      # Upload the extension.
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: ./dist

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ./**/*.vsix
            ./**/*.whl
            ./**/*.tar.gz
            ./**/*.sha256

      - name: Install ovsx
        run: npm install --global ovsx
      - name: Publish extension
        run: ovsx publish ./**/*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
